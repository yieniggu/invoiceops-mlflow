name: invoiceops-mlflow

services:
  postgres:
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD must be set (see mlflow-local.example.env)}
    # The first start of an empty volume bakes POSTGRES_PASSWORD into the database. A placeholder
    # must therefore be refused HERE, before initdb: rejecting it later (the MLflow entrypoint)
    # would leave a volume initialized with a password nobody should use. If that already
    # happened, see README, "Volumen de PostgreSQL con una contraseña equivocada".
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set +x; set -eu;
        case "$$POSTGRES_PASSWORD" in
          *replace-with*|*REPLACE_WITH*|*changeme*) echo 'MLFLOW_DB_PASSWORD (POSTGRES_PASSWORD) must not use the example placeholder' >&2; exit 1 ;;
        esac;
        exec docker-entrypoint.sh "$$@"
      - postgres-placeholder-guard
    command: ["postgres"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data

  minio:
    # Upstream minio/minio and quay.io/minio/* tags are no longer pullable: community fork pinned by
    # tag AND digest (see GATEWAY.md, "Riesgos residuales").
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set (see mlflow-local.example.env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set (see mlflow-local.example.env)}
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - mlflow_minio_data:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-pgsty/mc:RELEASE.2026-11-12T00-00-00Z@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set +x; set -eu; LC_ALL=C; export LC_ALL; umask 077;
        [ "$$(command -v printf)" = printf ] || { echo 'MinIO initializer requires builtin printf' >&2; exit 1; };
        : "$${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}";
        : "$${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}";
        case "$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD" in
          *replace-with*|*REPLACE_WITH*|*changeme*) echo 'MinIO credentials must not use the example placeholder' >&2; exit 1 ;;
        esac;
        json_low=$$(printf '\001'); json_high=$$(printf '\037'); json_meta='"\';
        json_quote() {
          json_output='"';
          while [ -n "$$json_input" ]; do
            json_prefix=$${json_input%%["$$json_low"-"$$json_high""$$json_meta"]*};
            json_output=$$json_output$$json_prefix;
            json_input=$${json_input#"$$json_prefix"};
            [ -n "$$json_input" ] || break;
            json_rest=$${json_input#?}; json_char=$${json_input%"$$json_rest"};
            case "$$json_char" in
              '"'|'\') json_output=$$json_output\\$$json_char ;;
              ["$$json_low"-"$$json_high"])
                json_code=$$(printf '%d' "'$$json_char") || return 1;
                json_escape=$$(printf '\\u%04x' "$$json_code") || return 1;
                json_output=$$json_output$$json_escape ;;
              *) json_output=$$json_output$$json_char ;;
            esac;
            json_input=$$json_rest;
          done;
          json_output=$$json_output'"';
        };
        json_input=$$MINIO_ROOT_USER;
        json_quote >/dev/null 2>&1 || { echo 'MinIO credential serialization failed' >&2; exit 1; };
        credentials='{"url":"http://minio:9000","api":"s3v4","path":"auto","accessKey":'$$json_output;
        json_input=$$MINIO_ROOT_PASSWORD;
        json_quote >/dev/null 2>&1 || { echo 'MinIO credential serialization failed' >&2; exit 1; };
        credentials=$$credentials',"secretKey":'$$json_output'}';
        printf '%s' "$$credentials" | mc alias import local >/dev/null 2>&1 || {
          status=$$?; echo 'MinIO alias initialization failed' >&2; exit "$$status";
        };
        mc mb --ignore-existing local/mlflow-artifacts >/dev/null 2>&1 || {
          status=$$?; echo 'MinIO bucket initialization failed' >&2; exit "$$status";
        }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set (see mlflow-local.example.env)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set (see mlflow-local.example.env)}
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    command: mlflow server --app-name=basic-auth --enable-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set (see mlflow-local.example.env)}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set (see mlflow-local.example.env)}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow-artifacts
      MLFLOW_AUTH_CONFIG_PATH: /run/mlflow-auth/auth.ini
      MLFLOW_AUTH_DATABASE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD must be set (see mlflow-local.example.env)}@postgres:5432/mlflow
      MLFLOW_AUTH_ADMIN_USERNAME: ${MLFLOW_AUTH_ADMIN_USERNAME:?MLFLOW_AUTH_ADMIN_USERNAME must be set in .env}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_AUTH_ADMIN_PASSWORD:?MLFLOW_AUTH_ADMIN_PASSWORD must be set in .env}
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?MLFLOW_DB_PASSWORD must be set (see mlflow-local.example.env)}@postgres:5432/mlflow
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY:?MLFLOW_FLASK_SERVER_SECRET_KEY must be set in .env}
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/mlflow-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

# Keys are prefixed so this file can be `include`d next to the app (which owns `postgres_data`).
# Volume names follow the compose project: `invoiceops` (invoiceops-stack) resolves to
# invoiceops_mlflow_postgres_data / invoiceops_mlflow_minio_data, which is what the stack expects;
# a standalone checkout (project `invoiceops-mlflow`) gets invoiceops-mlflow_mlflow_*. Data created
# before the rename lives in invoiceops-mlflow_postgres_data / _minio_data: copy it with
# scripts/migrate-standalone-volumes.sh (see GATEWAY.md, "Volúmenes: renombre y migración").
volumes:
  mlflow_postgres_data:
  mlflow_minio_data:
